
name: Deploy MyST site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Build static HTML
        run: myst build --html

     - name: Fix sitemap URLs for GitHub Pages
        run: |
          sed -i 's|http://localhost:3000|https://cecilehannay.github.io/The-Cat-Nanny|g' _build/html/sitemap.xml
          if [ -f _build/html/robots.txt ]; then
            sed -i 's|http://localhost:3000|https://cecilehannay.github.io/The-Cat-Nanny|g' _build/html/robots.txt
          fi        

      - name: Add Google verification file
        run: cp google01ce000260828be3.html _build/html/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        
